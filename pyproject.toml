# Packaging for tended (formerly the brain kernel). The wheel carries
# the kernel manifest as data inside the package (copied at build time
# by setup.py) and a `tended` command that births an instance from it.
# Inside a checkout or an instance, tools/brain.py is run directly.
[project]
name = "tended"
description = "An LLM-maintained knowledge substrate: governed markdown wiki, queue-and-tend self-maintenance, connectors, composable SQL views, MCP serving, and a chat-first workbench."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Muhamed Isabegovic" }]
dependencies = ["pyyaml>=6"]
dynamic = ["version"]

[project.optional-dependencies]
cluster = ["scikit-learn"]
full = ["tiktoken", "datasette", "pytest", "scikit-learn"]

[project.urls]
Homepage = "https://github.com/misabegovic/tended"
Repository = "https://github.com/misabegovic/tended"
Changelog = "https://github.com/misabegovic/tended/blob/main/CHANGELOG.md"
Issues = "https://github.com/misabegovic/tended/issues"

[project.scripts]
tended = "tended.cli:main"

[tool.setuptools]
packages = ["tended"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
