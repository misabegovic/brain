# brain.config.yml — per-organisation configuration for the brain kernel.
#
# The kernel (tools/, .claude/, ui/) reads this file so the code stays
# content-agnostic. Fill it in when you adopt the shell for a project.

# Human-readable organisation name. Used by docs and the UI title.
org: ""

# Sibling repos this brain actively tracks. Each entry gets a
# `wiki/<repo>/` shelf and is valid in `repos:` / `affects:`
# frontmatter. Resolved on disk under $BRAIN_PROJECTS_ROOT
# (default: ~/projects/).
active_repos: []

# Repos that were tracked once and are now archived. Still valid in
# frontmatter (for history) but excluded from the active corpus.
archived_repos: []

# Connector configuration (0.3 — snapshot-writers). Each connector is
# pull-only, no-ops until configured here, and writes immutable
# dedup-keyed snapshots into sources/<connector>/. Credentials live in
# .env (read-only-scoped tokens), never in this file.
connectors:
  github:
    # Extra owner/repo slugs to watch. Repos in active_repos are
    # auto-discovered from their sibling checkouts' origin remotes.
    repos: []
  notion:
    # Page ids or URLs to watch; re-snapshotted when last_edited moves.
    # Needs NOTION_TOKEN in .env.
    pages: []
  slack:
    # Channel names to pull. Needs SLACK_TOKEN in .env (read-only
    # scopes: channels:history, channels:read).
    channels: []
  datadog:
    # Datadog site (e.g. datadoghq.com, datadoghq.eu). Empty = off.
    # Needs DD_API_KEY + DD_APP_KEY in .env; scope the app key to
    # monitors_read + slos_read.
    site: ""
  langfuse:
    # Langfuse host (e.g. https://cloud.langfuse.com or self-host).
    # Empty = off. Needs LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY in
    # .env — Langfuse keys are write-capable (no read-only type):
    # use a dedicated project's keys or self-host.
    host: ""
  enola:
    # Architecture graph via the external `enola` binary (optional).
    # Complements the vendor-neutral `structure` connector below: enola
    # resolves call graphs and cross-repo edges that in-kernel extraction
    # cannot, at the cost of a binary that must be installed. Everything
    # skips-when-absent, so an unconfigured or uninstalled graph is a
    # named no-op, never a failure. Active repos are covered
    # automatically; list extra repo paths here. The cluster file
    # (mcp-arch.yaml) is GENERATED from this config and gitignored.
    repos: []
    # Override the defaults if a repo needs it; empty = built-in set.
    ignore: []
    explainers: []
  structure:
    # Deterministic code-shape snapshots + architectural-drift inbox
    # items. No network, no external binary, no LLM — reads a sibling
    # repo with read-only git and files. Active repos are covered
    # automatically; list extra repo paths (absolute, or names under
    # $BRAIN_PROJECTS_ROOT) here. Empty + no active repos = off.
    repos: []

# Attention board — the daily ranked shortlist of what deserves your
# day. Per wiki/brain/adrs/attention-board.md. The kernel ships the
# mechanism; the categories and their weights are yours. Nothing here
# needs credentials: the board reads what the connectors above already
# pulled, plus the inbox.
attention:
  # How many cards may sit in the top tier. The board is a shortlist,
  # not a backlog — if a sixth item genuinely belongs, the honest move
  # is to demote one and say so, never to widen the tier.
  now_tier_size: 5

  # Hard ceiling on active cards. Past this the groom must demote or
  # dismiss; a growing board is a failing board.
  max_active: 25

  # Categories are how two unlike items stay comparable: the weight
  # multiplies the card's score, and the render groups by category.
  # Every card takes exactly one — an item spanning categories takes
  # the highest-weighted one it touches, never a blend.
  #
  # The defaults below are deliberately generic, chosen to discriminate
  # in any organisation rather than to describe one. Replace them with
  # your own remit; keep `off-surface` so signal outside your scope has
  # somewhere honest to go rather than being silently dropped.
  categories:
    - name: breakage
      weight: 1.5
      # Something is failing now — an incident, a red pipeline, errors
      # in production. Time-sensitive by nature.
    - name: commitment
      weight: 1.3
      # Work already agreed to: a cycle item, an open review, a promise
      # made to someone. Not urgent by itself, but owed.
    - name: signal
      weight: 1.1
      # New information that may change a decision — research, a
      # competitor move, customer feedback, a contradicted assumption.
    - name: upkeep
      weight: 0.8
      # The brain's own hygiene: half-life crossings, link health,
      # drift. Real work, rarely worth displacing a plan for.
    - name: off-surface
      weight: 0.5
      # Outside this brain's remit. Kept visible so that a board full
      # of off-surface cards tells you your real work is not reaching
      # the channels — which is itself worth knowing.
